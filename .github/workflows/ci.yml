name: CI Build and GitOps Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - k8s/deployment.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Definir metadados da imagem
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/gitops-demo-app:${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.image.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Atualizar manifesto GitOps
        shell: bash
        env:
          IMAGE: ghcr.io/${{ steps.image.outputs.owner }}/gitops-demo-app:${{ github.sha }}
        run: |
          sed -i -E "s|(^[[:space:]]*image:).*|\1 ${IMAGE}|" k8s/deployment.yaml
          git diff --check
          git diff -- k8s/deployment.yaml

      - name: Commitar e enviar alteracao GitOps
        shell: bash
        run: |
          if git diff --quiet -- k8s/deployment.yaml; then
            echo "Manifesto ja aponta para esta imagem."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore(gitops): deploy ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:main

